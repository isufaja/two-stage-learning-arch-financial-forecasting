[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctts-reliability"
version = "0.1.0"
description = "Two-stage reliability estimation for financial time series forecasts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "tensorboard>=2.12",
  "torch>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
optimizers = ["adabelief-pytorch>=0.2"]

[project.scripts]
ctts-train = "ctts.train:main"
ctts-ablation = "ctts.train_ablation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

